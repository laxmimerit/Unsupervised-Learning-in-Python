[project]
name = "unsupervised-learning-in-python"
version = "0.1.0"
description = "Unsupervised Learning in Python"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Laxmi Kant Tiwari", email = "laxmimerit@gmail.com" }]
dependencies = [
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
    "pandas",
    "matplotlib",
    "jupyter",
    "ipykernel",
    "pyod>=3.6.7",
    "keras>=3.15.1",
    "torch>=2.14.1",
    "aeon>=1.6.0",
    "sentence-transformers>=6.1.0",
    "bertopic>=0.17.4",
    "ollama>=0.6.3",
    "rectools[torch]>=0.19.0",
]

[tool.uv]
package = false
# rectools 0.19 pins numpy<2 on Python 3.12; its models run on numpy 2 (aeon needs numpy>=2)
override-dependencies = ["numpy>=2", "torch>=2.14.1"]

# RTX 50xx (Blackwell) needs CUDA 12.8 or newer; torch 2.14 ships for CUDA 13.0; these also run on CPU
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
